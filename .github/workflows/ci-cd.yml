name: CI/CD Pipeline - Stellar Escrow Marketplace

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-smart-contracts:
    name: Build & Test Soroban Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Cargo Check
        run: cargo check --all

      - name: Run Contract Unit & Integration Tests
        run: cargo test --all

      - name: Build WASM Binaries
        run: cargo build --target wasm32-unknown-unknown --release

  test-and-build-frontend:
    name: Test & Build Responsive React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build
